<div class="container-fluid">
  <main class="text-center">
    <h4 class="mt-5 pt-5">Registration Form</h1>
  </main>
  <section class="container-fluid my-5 bg-light mx-auto p2 col-10 col-md-8 col-lg-4 rounded-3 shadow">
     <form class="needs-validation" novalidate onsubmit="showSuccess(event)">
  <div class="mb-3">
      <label for="name" class="form-label"> Full Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
      <div class="invalid-feedback">Please enter your full name.</div>
      <div class="valid-feedback">Good Job!</div>
    </div>
  <div class="col-md-6">
    <label for="validationCustomUsername" class="form-label">Lasst Name</label>
    <div class="input-group has-validation">
    <input type="text" class="form-control" id="validationCustomUsername" placeholder="Last Name" aria-describedby="inputGroupPrepend" required>
      <div class="invalid-feedback">
        Please choose a username.
  </div>
  </div>
  <div class="col-md-6">
    <label for="inputemail4" class="form-label">Email</label>
    <input type="email" class="form-control" id="inputemail4" placeholder="Email">
  </div>
  <div class="col-md-6">
    <label for="inputPassword4" class="form-label">Password</label>
    <input type="password" class="form-control" id="inputPassword4" placeholder="Password">
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label">Address</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Address 2</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
  </div>
  <div class="col-md-6">
    <label for="inputCity" class="form-label">City</label>
    <input type="text" class="form-control" id="inputCity">
  </div>
  <div class="col-md-4">
    <label for="inputState" class="form-label">State</label>
    <select id="inputState" class="form-select">
      <option selected>Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-2">
    <label for="inputZip" class="form-label">Zip</label>
    <input type="text" class="form-control" id="inputZip">
  </div>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Check me out
      </label>
    </div>
  </div>
  <div class="col-12 text-center " >
    <button type="submit" class="btn btn-primary btn-custom" >Register</button>
  </div>
</form>
  </section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function showSuccess(event) {
    event.preventDefault();
    const form = event.target;
    const submitBtn = document.getElementById('submitBtn');
    const loadingBtn = document.getElementById('loadingBtn');

    form.classList.add('was-validated');

    if (form.checkValidity()) {
      submitBtn.style.display = 'none';
      loadingBtn.style.display = 'inline-block';

      setTimeout(() => {
        const successModal = new bootstrap.Modal(document.getElementById('successModal'));
        successModal.show();

        form.reset();
        form.classList.remove('was-validated');
        loadingBtn.style.display = 'none';
        submitBtn.style.display = 'inline-block';
      }, 1500);
    }
  }
</script>

<script>
  function redirectToPage() {
    window.location.href = "index4.html";
  }
</script>
